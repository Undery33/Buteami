# Disposable LOCAL integration stack only; never deploy this database.
# From backend/: docker compose --profile app up --build
# Tests only: docker compose --profile test run --build --rm tests
name: buteami-backend-local

x-local-environment: &local-environment
  NODE_ENV: development
  PORT: "3000"
  APP_ORIGIN: http://localhost:${LOCAL_WEB_PORT:-8080}
  COOKIE_SECURE: "false"
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: buteami_test
  DB_USER: buteami_test
  DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in backend/.env}
  DB_TLS_CA_FILE: ""
  APP_SECRET: ${APP_SECRET:?Set a random APP_SECRET of at least 32 bytes in backend/.env}
  TRUST_PROXY_CIDRS: ""

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: buteami_test
      MARIADB_USER: buteami_test
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in backend/.env}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Set LOCAL_DB_ROOT_PASSWORD in backend/.env}
      MARIADB_ROOT_HOST: localhost
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-13306}:3306"
    volumes:
      - local_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    profiles: ["app"]
    build: .
    init: true
    environment: *local-environment
    command: ["npm", "run", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    init: true
    environment: *local-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        aliases: ["buteami-api"]

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deployment/web.Dockerfile
    ports:
      - "127.0.0.1:${LOCAL_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    init: true
    environment:
      <<: *local-environment
      NODE_ENV: test
      DB_TEST_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  local_db:
