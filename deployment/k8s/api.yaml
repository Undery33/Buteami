apiVersion: v1
kind: ServiceAccount
metadata:
  name: buteami-api
  namespace: default
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buteami-api
  namespace: default
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: buteami-api
  template:
    metadata:
      labels:
        app: buteami-api
    spec:
      serviceAccountName: buteami-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Build backend/Dockerfile and replace with an immutable reviewed tag/digest.
          image: ghcr.io/undery33/buteami-api:release-version-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: buteami-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buteami-api-secrets
                  key: DB_PASSWORD
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: buteami-api-secrets
                  key: APP_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: buteami-api-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buteami-api-secrets
                  key: SMTP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/buteami/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: db-ca
          secret:
            secretName: buteami-db-ca
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: buteami-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: buteami-api
  ports:
    - name: http
      port: 3000
      targetPort: http
