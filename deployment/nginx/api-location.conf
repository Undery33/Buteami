# Include INSIDE the existing HTTPS server block only after the operator sets
# its resolver to the pod's actual /etc/resolv.conf nameserver address.
# Merely copying this file into an image does not change live Nginx routing.
location /api/ {
    set $api_upstream buteami-api:3000;
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_hide_header X-Powered-By;
    client_max_body_size 16k;
    access_log off;
    add_header Cache-Control "no-store" always;
}
